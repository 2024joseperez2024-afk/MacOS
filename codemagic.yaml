workflows:
  Huevobit-MacOS:
    name: Huevobit Compilación macOS
    max_build_duration: 60

    environment:
      flutter: 3.24.3
      xcode: 16.0

    scripts:

      - name: Instalar dependencias
        script: |
          flutter pub get

      - name: Compilar para macOS Release
        script: |
          flutter build macos --release

      - name: Diagnóstico Keychain macOS
        script: |
          echo "=== DEFAULT KEYCHAIN ==="
          security default-keychain -d user || true

          echo "=== LIST KEYCHAINS ==="
          security list-keychains -d user || true

          echo "=== KEYCHAIN INFO ==="
          security show-keychain-info ~/Library/Keychains/login.keychain-db || true

          echo "=== macOS ==="
          sw_vers

    artifacts:
      - build/macos/Build/Products/Release/*.app
